[package]
name = "statusbar-client"
version = "0.5.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_WindowsProgramming",
  "Win32_UI_HiDpi", "Win32_Security",
] }
# native-tls = Windows SChannel: trusts the machine certificate store (internal CAs
# work without extra files) and keeps the executable small.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
