/* Notiflag for Icinga 2. Guide: integrations/nagios-icinga/README.md
 *
 * 1. Install the sender:  install -m 755 notiflag-notify.sh /usr/local/bin/notiflag-notify.sh
 *    (it is integrations/curl/notiflag-notify.sh; needs curl)
 * 2. Put the webhook URL alone into /etc/icinga2/notiflag-webhook-url (owner nagios/icinga, chmod 600):
 *      https://status.example.com/api/hooks/<integration token>
 * 3. Copy this file to /etc/icinga2/conf.d/notiflag.conf (on the config master:
 *    zones.d/master/notiflag.conf) and set  vars.notiflag = true  on hosts and services
 *    whose outage users should hear about.
 * 4. Check and reload:  icinga2 daemon -C && systemctl reload icinga2
 */

object User "notiflag" {
  display_name = "Notiflag (messages on users' desktops)"
  enable_notifications = true
  states = [ Up, Down, OK, Warning, Critical, Unknown ]
  types = [ Problem, Recovery ]
}

object NotificationCommand "notiflag-host" {
  command = [ "/usr/local/bin/notiflag-notify.sh", "$host.state$", "$host.name$", "", "$host.output$" ]
  env = {
    NOTIFLAG_URL_FILE = "/etc/icinga2/notiflag-webhook-url"
    NOTIFLAG_TYPE = "$notification.type$"
  }
  timeout = 30s
}

object NotificationCommand "notiflag-service" {
  command = [ "/usr/local/bin/notiflag-notify.sh", "$service.state$", "$host.name$", "$service.name$", "$service.output$" ]
  env = {
    NOTIFLAG_URL_FILE = "/etc/icinga2/notiflag-webhook-url"
    NOTIFLAG_TYPE = "$notification.type$"
  }
  timeout = 30s
}

apply Notification "notiflag" to Host {
  command = "notiflag-host"
  users = [ "notiflag" ]
  types = [ Problem, Recovery ]
  states = [ Up, Down ]
  interval = 0        // send once per state change; Notiflag would answer "duplicate" anyway
  assign where host.vars.notiflag == true
}

apply Notification "notiflag" to Service {
  command = "notiflag-service"
  users = [ "notiflag" ]
  types = [ Problem, Recovery ]
  states = [ OK, Warning, Critical, Unknown ]   // drop Warning if warnings should not reach users
  interval = 0
  assign where service.vars.notiflag == true
}
