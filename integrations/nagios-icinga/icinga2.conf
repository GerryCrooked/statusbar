/* Statusbar for Icinga 2. Guide: integrations/nagios-icinga/README.md
 *
 * 1. Install the sender:  install -m 755 statusbar-notify.sh /usr/local/bin/statusbar-notify.sh
 *    (it is integrations/curl/statusbar-notify.sh; needs curl)
 * 2. Put the webhook URL alone into /etc/icinga2/statusbar-webhook-url (owner nagios/icinga, chmod 600):
 *      https://status.example.com/api/hooks/<integration token>
 * 3. Copy this file to /etc/icinga2/conf.d/statusbar.conf (on the config master:
 *    zones.d/master/statusbar.conf) and set  vars.statusbar = true  on hosts and services
 *    whose outage users should hear about.
 * 4. Check and reload:  icinga2 daemon -C && systemctl reload icinga2
 */

object User "statusbar" {
  display_name = "Statusbar (messages on users' desktops)"
  enable_notifications = true
  states = [ Up, Down, OK, Warning, Critical, Unknown ]
  types = [ Problem, Recovery ]
}

object NotificationCommand "statusbar-host" {
  command = [ "/usr/local/bin/statusbar-notify.sh", "$host.state$", "$host.name$", "", "$host.output$" ]
  env = {
    STATUSBAR_URL_FILE = "/etc/icinga2/statusbar-webhook-url"
    STATUSBAR_TYPE = "$notification.type$"
  }
  timeout = 30s
}

object NotificationCommand "statusbar-service" {
  command = [ "/usr/local/bin/statusbar-notify.sh", "$service.state$", "$host.name$", "$service.name$", "$service.output$" ]
  env = {
    STATUSBAR_URL_FILE = "/etc/icinga2/statusbar-webhook-url"
    STATUSBAR_TYPE = "$notification.type$"
  }
  timeout = 30s
}

apply Notification "statusbar" to Host {
  command = "statusbar-host"
  users = [ "statusbar" ]
  types = [ Problem, Recovery ]
  states = [ Up, Down ]
  interval = 0        // send once per state change; Statusbar would answer "duplicate" anyway
  assign where host.vars.statusbar == true
}

apply Notification "statusbar" to Service {
  command = "statusbar-service"
  users = [ "statusbar" ]
  types = [ Problem, Recovery ]
  states = [ OK, Warning, Critical, Unknown ]   // drop Warning if warnings should not reach users
  interval = 0
  assign where service.vars.statusbar == true
}
