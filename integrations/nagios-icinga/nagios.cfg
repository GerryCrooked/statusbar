# Notiflag for Nagios Core 3/4, Naemon and Icinga 1.
# Guide: integrations/nagios-icinga/README.md
#
# 1. Install the sender:   install -m 755 notiflag-notify.sh /usr/local/bin/notiflag-notify.sh
#    (it is integrations/curl/notiflag-notify.sh; needs curl)
# 2. Put the webhook URL alone into /etc/notiflag/webhook-url (owner nagios, chmod 600):
#      https://status.example.com/api/hooks/<integration token>
# 3. Include this file (cfg_file=/etc/nagios/objects/notiflag.cfg) and add the contact
#    "notiflag" to the hosts and services whose outage users should hear about.
# 4. Check and reload:  nagios -v /etc/nagios/nagios.cfg && systemctl reload nagios

define command {
    command_name  notiflag-service
    command_line  /usr/bin/env NOTIFLAG_URL_FILE=/etc/notiflag/webhook-url NOTIFLAG_TYPE=$NOTIFICATIONTYPE$ /usr/local/bin/notiflag-notify.sh "$SERVICESTATE$" "$HOSTNAME$" "$SERVICEDESC$" "$SERVICEOUTPUT$"
}

define command {
    command_name  notiflag-host
    command_line  /usr/bin/env NOTIFLAG_URL_FILE=/etc/notiflag/webhook-url NOTIFLAG_TYPE=$NOTIFICATIONTYPE$ /usr/local/bin/notiflag-notify.sh "$HOSTSTATE$" "$HOSTNAME$" "" "$HOSTOUTPUT$"
}

# A contact that is not a person: it stands for "the users' screens".
define contact {
    contact_name                   notiflag
    alias                          Notiflag (messages on users' desktops)
    host_notifications_enabled     1
    service_notifications_enabled  1
    host_notification_period       24x7
    service_notification_period    24x7
    host_notification_options      d,u,r        ; down, unreachable, recovery
    service_notification_options   w,u,c,r      ; drop "w" if warnings should not reach users
    host_notification_commands     notiflag-host
    service_notification_commands  notiflag-service
}

