# Nagios / Naemon / Icinga 1 command definitions. Copy integrations/notify.sh to the monitoring host,
# then reference these commands in a contact (service_notification_commands / host_notification_commands).
# Notification options should include problems and recoveries (w,u,c,r and d,u,r).

define command {
    command_name  statusbar-service
    command_line  STATUSBAR_URL='https://status.example.com/api/hooks/<token>' /usr/local/bin/notify.sh "$SERVICESTATE$" "$HOSTNAME$" "$SERVICEDESC$" "$SERVICEOUTPUT$"
}

define command {
    command_name  statusbar-host
    command_line  STATUSBAR_URL='https://status.example.com/api/hooks/<token>' /usr/local/bin/notify.sh "$HOSTSTATE$" "$HOSTNAME$" "" "$HOSTOUTPUT$"
}
